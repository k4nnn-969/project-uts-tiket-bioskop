<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIX ID | Login & Register</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=main-fix-1">
</head>
<body data-page="auth">
<div class="topline"></div>
<main class="auth-wrap">
  <div class="card auth-card">
    <a class="brand" href="../../home-movie/index.html"><span class="brand-tix">TIX</span><span class="brand-id">ID</span><span class="brand-dot"></span></a>
    <h1 id="auth-title">Selamat datang!</h1>
    <p class="subtitle">Masuk atau buat akun untuk melanjutkan pemesanan tiket.</p>
    <div class="tabs">
      <button class="tab active" id="login-tab" type="button">Login</button>
      <button class="tab" id="register-tab" type="button">Register</button>
    </div>
    <div id="auth-message"></div>
    <form id="auth-form" class="form-grid">
      <div class="field" id="name-field" hidden><label>Nama Lengkap</label><input id="name" type="text" autocomplete="name"></div>
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="nama@email.com"></div>
      <div class="field"><label>Kata Sandi</label><input id="password" type="password" minlength="6" required autocomplete="current-password"></div>
      <div class="actions"><button class="btn primary" id="submit-btn" type="submit">Login</button><a class="btn" href="../../home-movie/index.html">Kembali</a></div>
    </form>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
